name: D1 migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply migrations after reviewing a previous inspection run
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: beauty-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate branch and production configurations
        run: |
          test "$GITHUB_REF" = 'refs/heads/feature/microsservices'
          node --input-type=module <<'NODE'
          import { workerConfigurations, readConfiguration, validateWorkerConfigurations } from './scripts/worker-deployment-config.mjs';
          validateWorkerConfigurations(Object.fromEntries(Object.entries(workerConfigurations).map(([name,path])=>[name,readConfiguration(path)])), true);
          NODE
      - run: npm run check
      - name: Check environment approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs
  migrations:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: List pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list beauty_db --remote --config apps/operations-worker/wrangler.jsonc
      - name: Apply reviewed migrations
        if: inputs.apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply beauty_db --remote --config apps/operations-worker/wrangler.jsonc
      - name: Verify migration history
        if: inputs.apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list beauty_db --remote --config apps/operations-worker/wrangler.jsonc

name: Infrastructure audit

on:
  workflow_dispatch:
  # Enable only in a reviewed commit on main after successful manual qualification:
  # schedule:
  #   - cron: '0 6 * * 0'

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infrastructure-audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs infrastructure-audit
      - name: Audit published manifests without mutations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/infra/run.mjs audit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-audit-${{ github.run_id }}
          path: .cache/infrastructure/result.json
          if-no-files-found: ignore

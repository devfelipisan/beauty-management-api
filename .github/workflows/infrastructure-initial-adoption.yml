name: Initial infrastructure adoption

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: beauty-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          test "$GITHUB_REF" = 'refs/heads/feature/microsservices'
          npm run check
          node scripts/test-deployment.mjs
          node scripts/deploy/manifest-check.mjs
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs production
  qualify:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Recheck production approval policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs production
      - name: Qualify historical versions without publishing Workers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/infra/initial-adoption.mjs
      - name: Preserve partial registration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/infrastructure/result.json
          if-no-files-found: ignore

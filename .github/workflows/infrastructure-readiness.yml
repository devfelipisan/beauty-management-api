name: Infrastructure readiness

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only inspection or explicit baseline qualification
        type: choice
        options: [readiness, media, baseline]
        default: readiness

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: beauty-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          test "$GITHUB_REF" = 'refs/heads/feature/microsservices'
          npm run check
          node scripts/test-deployment.mjs
          node scripts/deploy/manifest-check.mjs
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs
  inspect:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs
      - name: Inspect selected readiness scope
        env:
          ACTION: ${{ inputs.action }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/infra/run.mjs "$ACTION"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-${{ github.run_id }}
          path: .cache/infrastructure/result.json
          if-no-files-found: ignore

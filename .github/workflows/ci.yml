name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beauty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beauty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: beauty_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Apply PostgreSQL migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql --set=ON_ERROR_STOP=1 --file "${migration}"
          done
      - name: PostgreSQL security and concurrency constraints
        run: psql --set=ON_ERROR_STOP=1 --file database/tests/security_and_constraints.sql

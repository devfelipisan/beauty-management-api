name: CI

on:
  push:
    branches: [main, feature/microsservices]
  pull_request:
    branches: [main, feature/microsservices]
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: ID of the failed production CI run
        required: true
        type: string
      recovery_attempt:
        description: Attempt that produced the recovery plan
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deployRequired: ${{ steps.changes.outputs.deployRequired }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify Worker source exports before builds
        run: npm run test:workers -- test/workers/create-appointment.spec.ts test/workers/tenant-isolation.spec.ts test/workers/service-binding-caller.spec.ts
      - name: Check formatting of changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || printf 4b825dc642cb6eb9a060e54bf8d69288fbee4904)
          fi
          node scripts/check-format-changes.mjs "$BASE_SHA" HEAD
          node scripts/deploy/changed-files.mjs "$BASE_SHA" HEAD
      - name: Verify code, contracts, architecture and local migrations
        run: npm run check:release
      - name: Reject generated drift
        run: git diff --exit-code
  publish:
    name: Deploy after CI
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/microsservices' && needs.verify.result == 'success' && needs.verify.outputs.deployRequired == 'true'
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/deploy-workers.yml
    with:
      commit_sha: ${{ github.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  recovery-plan:
    name: Load recovery plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/microsservices'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      target: ${{ steps.plan.outputs.target }}
      deploy_job_id: ${{ steps.plan.outputs.deploy_job_id }}
    steps:
      - name: Verify source run and load its immutable plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.recovery_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.recovery_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ && "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          api="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          source_sha=$(gh api "$api" |
            jq -er --arg repo "$GITHUB_REPOSITORY" --argjson attempt "$SOURCE_ATTEMPT" '
              select(
                .repository.full_name == $repo and .head_repository.full_name == $repo and
                .head_branch == "feature/microsservices" and .path == ".github/workflows/ci.yml" and
                .event == "push" and .status == "completed" and .conclusion == "failure" and
                .run_attempt == $attempt
              ) | .head_sha | select(test("^[0-9a-f]{40}$"))
            ')
          deploy_job_id=$(gh api --paginate "$api/attempts/$SOURCE_ATTEMPT/jobs?per_page=100" |
            jq -ser --arg sha "$source_sha" '
              [.[].jobs[] | select(
                .conclusion == "failure" and
                (.name == "Deploy after CI / Deploy" or
                 (.name | test("^Deploy after CI / Publish (all|billing|clinical|operations) at " + $sha + "$"))) and
                any(.steps[]?; .name == "Validate provenance, publish and verify Workers" and .conclusion == "failure")
              )] | select(length == 1) | .[0].id | select(type == "number" and . > 0)
            ')
          printf 'deploy_job_id=%s\n' "$deploy_job_id" >> "$GITHUB_OUTPUT"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "worker-recovery-$SOURCE_ATTEMPT" --dir recovery
          jq -e '
            .status == "ready" and (.worker | IN("billing", "clinical", "operations")) and
            (.target | test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"))
          ' recovery/plan.json >/dev/null
          jq . recovery/plan.json
          printf 'plan=%s\n' "$(jq -c . recovery/plan.json)" >> "$GITHUB_OUTPUT"
          printf 'target=%s\n' "$(jq -r '.worker + " " + .target' recovery/plan.json)" >> "$GITHUB_OUTPUT"
  recover:
    name: Restore ${{ needs.recovery-plan.outputs.target }}
    outputs:
      restored: ${{ steps.restore.outputs.restored }}
    needs: [verify, recovery-plan]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/microsservices'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: beauty-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Recheck production approval policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs production
      - name: Revalidate and restore the approved version
        id: restore
        env:
          APPROVED_PLAN: ${{ needs.recovery-plan.outputs.plan }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .cache/worker-recovery
          printf '%s\n' "$APPROVED_PLAN" > .cache/worker-recovery/plan.json
          node scripts/infra/worker-recovery.mjs apply .cache/worker-recovery/plan.json | tee .cache/worker-recovery/result.json
          jq -e '.status == "restored"' .cache/worker-recovery/result.json >/dev/null
          echo 'restored=true' >> "$GITHUB_OUTPUT"
      - name: Preserve recovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-recovery-result-${{ github.run_attempt }}
          path: .cache/worker-recovery/result.json
          if-no-files-found: ignore
  retry-deploy:
    name: Retry the original production deploy
    needs: [recovery-plan, recover]
    if: needs.recover.result == 'success' && needs.recover.outputs.restored == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue the failed deploy job from the original run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.recovery_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.recovery_attempt }}
          DEPLOY_JOB_ID: ${{ needs.recovery-plan.outputs.deploy_job_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ && "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ && "$DEPLOY_JOB_ID" =~ ^[1-9][0-9]*$ ]]
          api="repos/$GITHUB_REPOSITORY/actions"
          gh api "$api/runs/$SOURCE_RUN" |
            jq -e --argjson attempt "$SOURCE_ATTEMPT" '
              .run_attempt == $attempt and .status == "completed" and .conclusion == "failure"
            ' >/dev/null
          gh api --method POST "$api/jobs/$DEPLOY_JOB_ID/rerun"
          printf 'Deploy job %s queued in original run %s.\n' "$DEPLOY_JOB_ID" "$SOURCE_RUN"

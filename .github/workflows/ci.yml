
name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - feature/microsservices

permissions:
  contents: read

jobs:
  verify:
    name: Verify code quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Test deployment configuration
        run: node --test scripts/worker-deployment-config.test.mjs scripts/worker-required-secrets.test.mjs

      - name: Validate deployment configuration
        run: node scripts/worker-deployment-config.mjs

      - name: Verify clean worktree
        run: git diff --exit-code

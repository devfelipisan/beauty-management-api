name: CI

on:
  pull_request:
    branches:
      - main
      - feature/microsservices
  push:
     branches:
       - main
       - feature/microsservices

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code

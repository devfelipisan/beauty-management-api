
name: Deploy Beauty Workers

on:
  push:
    branches:
      - feature/microsservices
    paths:
      - .github/deploy/request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: beauty-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      worker: ${{ steps.request.outputs.worker }}
      requestId: ${{ steps.request.outputs.requestId }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate deployment request and JSONC configurations
        id: request
        run: |
          node scripts/worker-deployment-config.mjs
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { deploymentRequest } from './scripts/worker-deployment-config.mjs';
          const request = deploymentRequest(JSON.parse(readFileSync('.github/deploy/request.json', 'utf8')));
          appendFileSync(process.env.GITHUB_OUTPUT, `mode=${request.mode}\nworker=${request.worker}\nrequestId=${request.requestId}\n`);
          NODE
      - run: npm run check
      - run: node --test scripts/worker-deployment-config.test.mjs
      - run: git diff --exit-code
      - name: Verify production requires approval
        if: steps.request.outputs.mode == 'deploy'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs
      - name: Reject direct mock composition in Worker entrypoints
        if: steps.request.outputs.mode == 'deploy'
        shell: bash
        run: |
          if grep -RInE 'MockIdentityProvider|MockTenantMembershipProvider' apps/*-worker/src --include='*.ts'; then
            echo "::error::Direct mock composition in Worker runtime"
            exit 1
          fi

  deploy:
    needs: validate
    if: needs.validate.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Recheck environment protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs
      - name: Bootstrap missing private Workers
        if: needs.validate.outputs.worker == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/bootstrap-workers.mjs --apply
      - name: Publish selected Workers sequentially
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-workers.mjs
      - name: Preserve partial deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/deployment/result.json
          if-no-files-found: ignore

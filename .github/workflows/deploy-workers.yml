
name: Deploy Beauty Workers

on:
  push:
    branches:
      - feature/microsservices

permissions:
  contents: read
  actions: read

concurrency:
  group: beauty-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      mode: ${{ steps.request.outputs.mode }}
      worker: ${{ steps.request.outputs.worker }}
      requestId: ${{ steps.request.outputs.requestId }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Test deployment configuration
        run: node --test scripts/worker-deployment-config.test.mjs scripts/worker-required-secrets.test.mjs

      - name: Verify clean worktree
        run: git diff --exit-code

      - name: Validate deployment request and JSONC configurations
        id: request
        shell: bash
        run: |
          set -euo pipefail
          node scripts/worker-deployment-config.mjs
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { deploymentRequest } from './scripts/worker-deployment-config.mjs';

          const request = deploymentRequest(
            JSON.parse(readFileSync('.github/deploy/request.json', 'utf8')),
          );

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `mode=${request.mode}\nworker=${request.worker}\nrequestId=${request.requestId}\n`,
          );
          NODE

      - name: Verify production requires approval
        if: steps.request.outputs.mode == 'deploy'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs

      - name: Reject direct mock composition in Worker entrypoints
        if: steps.request.outputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --include='*.ts' \
            'MockIdentityProvider|MockTenantMembershipProvider' \
            apps/*-worker/src; then
            echo '::error::Direct mock composition in Worker runtime'
            exit 1
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: [validate]

    if: >-
      ${{
        needs.validate.result == 'success' &&
        needs.validate.outputs.mode == 'deploy' &&
        github.ref == 'refs/heads/feature/microsservices'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck environment protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs

      - name: Verify required remote binding names before any publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/worker-required-secrets.mjs

      - name: Bootstrap missing private Workers
        if: needs.validate.outputs.worker == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/bootstrap-workers.mjs --apply

      - name: Publish selected Workers sequentially
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-workers.mjs

      - name: Preserve partial deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/deployment/result.json
          if-no-files-found: ignore

name: Publicar Workers

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full approved commit SHA from feature/microsservices
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Preparar publicação
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      worker: ${{ steps.request.outputs.worker }}
      requestId: ${{ steps.request.outputs.requestId }}
      commitSha: ${{ steps.request.outputs.commitSha }}
    steps:
      - name: Obter código do commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar commit solicitado e CI aprovado
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: node scripts/deploy/prepare.mjs --sha "$REQUESTED_SHA"
      - name: Verificar proteção de produção
        if: steps.request.outputs.mode == 'deploy'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs production

  deploy:
    name: Publicar ${{ needs.prepare.outputs.worker }} no commit ${{ needs.prepare.outputs.commitSha }}
    needs: prepare
    if: needs.prepare.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: beauty-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - name: Obter código do commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commitSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar orquestração confiável separada do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-control
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Revalidar política de aprovação
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .release-control/scripts/check-production-protection.mjs production
      - name: Verificar disponibilidade das credenciais Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::production secret CLOUDFLARE_API_TOKEN unavailable"
            exit 1
          fi
          if [[ -z "${CF_ACCOUNT_ID//[[:space:]]/}" ]]; then
            echo "::error::production variable CLOUDFLARE_ACCOUNT_ID unavailable"
            exit 1
          fi
      - name: Validar proveniência, publicar e verificar Workers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_SHA: ${{ needs.prepare.outputs.commitSha }}
        run: node .release-control/scripts/deploy-workers.mjs --sha "$TARGET_SHA"
      - name: Salvar resultados e publicações parciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ needs.prepare.outputs.commitSha }}-${{ github.run_attempt }}
          path: .cache/deployment/result.json
          if-no-files-found: ignore

name: Deploy Beauty Workers

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
    secrets:
      CLOUDFLARE_DEPLOY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full approved commit SHA from feature/microsservices
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      worker: ${{ steps.request.outputs.worker }}
      requestId: ${{ steps.request.outputs.requestId }}
      commitSha: ${{ steps.request.outputs.commitSha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate immutable request and trusted CI
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: node scripts/deploy/prepare.mjs --sha "$REQUESTED_SHA"
      - name: Verify production protection
        if: steps.request.outputs.mode == 'deploy'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-production-protection.mjs production

  deploy:
    name: Publish ${{ needs.prepare.outputs.worker }} at ${{ needs.prepare.outputs.commitSha }}
    needs: prepare
    if: needs.prepare.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: beauty-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commitSha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Keep trusted orchestration separate from selected application code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-control
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Recheck approval policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .release-control/scripts/check-production-protection.mjs production
      - name: Release with one preflight and directed postchecks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_SHA: ${{ needs.prepare.outputs.commitSha }}
        run: node .release-control/scripts/deploy-workers.mjs --sha "$TARGET_SHA"
      - name: Preserve partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ needs.prepare.outputs.commitSha }}-${{ github.run_attempt }}
          path: .cache/deployment/result.json
          if-no-files-found: ignore

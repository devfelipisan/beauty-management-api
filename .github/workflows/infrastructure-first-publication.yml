name: Primeira publicação — excepcional

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full candidate SHA approved in first-publication.json
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: beauty-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar requisitos e testes
    runs-on: ubuntu-latest
    steps:
      - name: Validar formato do commit candidato
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Obter código do commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar candidato, contratos RPC e dry-runs
        run: |
          npm run check
          git diff --exit-code
      - name: Preparar orquestração confiável
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-control
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar dependências
        run: npm ci
        working-directory: .release-control
      - name: Testar orquestração confiável separadamente
        working-directory: .release-control
        run: |
          node scripts/test-deployment.mjs
          git diff --exit-code
      - name: Validar manifesto do candidato
        run: node .release-control/scripts/deploy/manifest-check.mjs
      - name: Validar primeira publicação revisada e CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: node .release-control/scripts/infra/first-publication.mjs --sha "$TARGET_SHA" --check
  publish:
    name: Publicar primeiras versões
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - name: Obter código do commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar orquestração confiável
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-control
          fetch-depth: 0
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar dependências
        run: npm ci
        working-directory: .release-control
      - name: Publicar primeiras versões gerenciadas revisadas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: node .release-control/scripts/infra/first-publication.mjs --sha "$TARGET_SHA"
      - name: Salvar snapshot de recuperação e resultados parciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/first-publication/result.json
          if-no-files-found: ignore

services:
  postgres:
    image: postgres:18-alpine
    container_name: beauty-management-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beauty_management}
      POSTGRES_USER: ${POSTGRES_USER:-beauty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty_local_password}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-beauty} -d ${POSTGRES_DB:-beauty_management}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
